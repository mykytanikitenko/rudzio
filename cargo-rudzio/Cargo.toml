[package]
name = "cargo-rudzio"
version = "0.2.0"
edition = { workspace = true }
description = "Cargo subcommand: `cargo rudzio test` auto-generates a single-binary aggregator that runs every rudzio test in the workspace under one `#[rudzio::main]`."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mykytanikitenko/rudzio"
readme = "README.md"
keywords = ["cargo-subcommand", "testing", "async", "tokio", "compio"]
categories = ["development-tools::cargo-plugins", "development-tools::testing"]
# Every `tests/*.rs` file is a sub-module of `tests/main.rs` (the
# rudzio-aggregated integration test binary). Disable cargo's
# auto-discovery so it doesn't also try to compile each sub-module as
# its own standalone integration test bin — `crate::support` is not
# visible from those auto-discovered targets and `tests/main.rs` is
# the only intended entry point.
autotests = false

[lib]
name = "cargo_rudzio"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "cargo-rudzio"
path = "src/main.rs"
test = false

[[test]]
name = "main"
path = "tests/main.rs"
harness = false

[dependencies]
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
rudzio-migrate = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits", "visit-mut"] }
toml_edit = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
serde_json = "=1.0.154"
# `cargo-rudzio-test-helpers` carries the shared rudzio Suite/Test
# scaffolding the integration tests use to provision a per-suite
# tempdir + pre-warmed CARGO_HOME. It lives in a sibling crate so the
# bridge (which mirrors dev-deps) can resolve it under v2 — no
# cfg-gating tricks, no public-API leakage from cargo-rudzio itself.
cargo-rudzio-test-helpers = { path = "../cargo-rudzio-test-helpers" }
rudzio = { workspace = true, features = [
  "common",
  "runtime-tokio-multi-thread",
  "runtime-tokio-current-thread",
  "runtime-tokio-local",
  "runtime-compio",
  "runtime-embassy",
  "runtime-futures",
  "runtime-async-std",
  "runtime-smol",
  "runtime-monoio",
] }
tempfile = "=3.27.0"

# Unix-only test dependencies.
#
# `bug_14_monolith_sigkill_spec` uses `process_group(0)` to reap the
# entire grandchild cargo tree on its safety-bound timeout. Safe signal
# delivery (`killpg`, `getpgid`) goes through `rustix` (`process`
# feature) so the spec carries no `unsafe` FFI. `libc` remains only for
# the `pid_t` type alias used by `bug_14` and `edge_dep_rendering_e2e_spec`.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
rustix = { version = "=1.1.5", features = ["process"] }

[lints]
workspace = true
