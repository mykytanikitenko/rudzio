[package]
name = "cargo-rudzio"
version = "0.1.1"
edition = { workspace = true }
description = "Cargo subcommand: `cargo rudzio test` auto-generates a single-binary aggregator that runs every rudzio test in the workspace under one `#[rudzio::main]`."
license = "MIT OR Apache-2.0"
repository = "https://github.com/mykytanikitenko/rudzio"
readme = "../README.md"
keywords = ["cargo-subcommand", "testing", "async", "tokio", "compio"]
categories = ["development-tools::cargo-plugins", "development-tools::testing"]

[lib]
name = "cargo_rudzio"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "cargo-rudzio"
path = "src/main.rs"
test = false

[[test]]
name = "main"
path = "tests/main.rs"
harness = false

[dependencies]
anyhow = { workspace = true }
cargo_metadata = { workspace = true }
rudzio-migrate = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
rudzio = { workspace = true, features = [
  "common",
  "runtime-tokio-multi-thread",
  "runtime-tokio-current-thread",
  "runtime-tokio-local",
  "runtime-compio",
  "runtime-embassy",
  "runtime-futures",
  "runtime-async-std",
  "runtime-smol",
  "runtime-monoio",
] }
tempfile = "=3.27.0"

# libc is Unix-only here: `build_dir_deadlock_spec` uses
# `process_group(0)` + `killpg` to reap the entire grandchild cargo
# tree on its 180s timeout. Without process-group cleanup, SIGKILL on
# `cargo-rudzio` leaves the nested `cargo build --bins` grandchildren
# alive (they are blocked on the same `flock` we are testing for), and
# they accumulate across runs. Deadlock under `[build] build-dir` is a
# Unix-cargo phenomenon; the test file itself is gated with
# `#![cfg(unix)]`.
[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[lints]
workspace = true
