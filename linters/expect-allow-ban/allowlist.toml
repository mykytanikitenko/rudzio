# expect-allow-ban allowlist
#
# Every `#[expect(...)]` / `#[allow(...)]` attribute in the workspace must
# have one entry here, matched exactly by (path, line, kind, lints). An entry
# whose line drifts or whose site is deleted becomes an orphan and fails CI;
# an attribute without an entry is an unallowlisted hit and fails CI.
#
# `reason` is the human-vetted justification for the suppression and mirrors
# the in-source `reason = "..."` string (the code's own stated WHY). It is
# rendered into the orphan report so a reviewer of a failing CI sees what each
# allowlisted entry claims about itself.
#
# Matching is line-based and exact: a suppression that moves must have its
# `line` re-pointed here; a suppression that is deleted must have its entry
# removed; a new suppression must add an entry. No wildcards, no path globs.

