# expect-allow-ban allowlist
#
# Every `#[expect(...)]` / `#[allow(...)]` attribute in the workspace must
# have one entry here, matched exactly by (path, key, kind, lints). An entry
# whose site is deleted becomes an orphan and fails CI; an attribute without
# an entry is an unallowlisted hit and fails CI.
#
# `key` is the STRUCTURAL identity of the suppression: the `::`-joined path
# of enclosing items (mods, fns, structs, impl self-types, traits, and their
# associated items). A file-scope inner attribute (`#![allow(...)]` at crate
# root) has the empty key. When a single item carries several identical
# suppressions (e.g. two `#[expect(unsafe_code)]` blocks in one fn), the
# second and later occurrences get a `.1`, `.2`, ... suffix in source order.
# Because the key is line-independent, entries survive unrelated edits above
# the site without re-pointing.
#
# `reason` is the human-vetted justification for the suppression and mirrors
# the in-source `reason = "..."` string (the code's own stated WHY). It is
# rendered into the orphan report so a reviewer of a failing CI sees what each
# allowlisted entry claims about itself.


